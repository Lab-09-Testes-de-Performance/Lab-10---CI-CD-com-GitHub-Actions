spring.application.name=atividade-pratica

# Nome do banco em memória
spring.datasource.url=jdbc:h2:mem:lojadb

# Driver do H2
spring.datasource.driverClassName=org.h2.Driver

# Usuário padrão do H2
spring.datasource.username=sa

# Senha vazia por padrão
spring.datasource.password=

# Habilita o console web do H2
spring.h2.console.enabled=true

# Caminho para acessar o console
spring.h2.console.path=/h2-console

# Mostra comandos SQL no console
spring.jpa.show-sql=true

# Formata o SQL exibido
spring.jpa.properties.hibernate.format_sql=true

# Cria as tabelas automaticamente ao iniciar
spring.jpa.hibernate.ddl-auto=create

# Permite rodar o data.sql após criação das tabelas
spring.jpa.defer-datasource-initialization=true

# Habilita inicialização por script SQL
spring.sql.init.mode=always