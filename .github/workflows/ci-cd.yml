
name: Pipeline CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: atividade-pratica/pom.xml

      - name: Compilar e testar
        working-directory: atividade-pratica
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify
