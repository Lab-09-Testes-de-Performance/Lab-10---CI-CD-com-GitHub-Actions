name: Pipeline CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/atividade-pratica

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: atividade-pratica/pom.xml

      - name: Preparar Maven Wrapper
        working-directory: atividade-pratica
        run: |
          ls -la
          ls -la .mvn/wrapper || true
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Compilar e testar
        working-directory: atividade-pratica
        run: ./mvnw -B -ntp clean verify

      - name: Guardar o JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: atividade-pratica/target/*.jar
          if-no-files-found: error

  docker:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar o JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: atividade-pratica/target

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: atividade-pratica
          file: atividade-pratica/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}